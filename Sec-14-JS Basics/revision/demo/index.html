<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* moved inline styles here to satisfy linting */
      #myImage {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <p>
      JavaScript can change HTML attribute values. In this case JavaScript
      changes the value of the src (source) attribute of an image.
    </p>
    <button onclick="document.getElementById('myImage').src = 'pic_bulbon.gif'">
      Turn on the light
    </button>
    <img id="myImage" src="pic_bulboff.gif" alt="Light bulb off" />
    <button
      onclick="document.getElementById('myImage').src = 'pic_bulboff.gif'"
    >
      Turn off the light
    </button>
  </body>
</html>
